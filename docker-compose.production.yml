services:
  postgres:
    image: postgres:17-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER requerido}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD requerido}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB requerido}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    volumes:
      - buzzbee_postgres_data:/var/lib/postgresql/data
    networks:
      - db
    security_opt:
      - no-new-privileges:true

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile.production
    restart: always
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET requerido}
      MFA_ENCRYPTION_KEY: ${MFA_ENCRYPTION_KEY:?MFA_ENCRYPTION_KEY requerido}
      INTEGRATION_ENCRYPTION_KEY: ${INTEGRATION_ENCRYPTION_KEY:?INTEGRATION_ENCRYPTION_KEY requerido}
      CLIENT_URL: https://${APP_DOMAIN:?APP_DOMAIN requerido}
      TRUST_PROXY: "1"
      COOKIE_SECURE: "true"
      COOKIE_SAME_SITE: ${COOKIE_SAME_SITE:-lax}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
      ALLOW_LEGACY_BEARER_AUTH: "false"
      PRIVATE_STORAGE_DRIVER: s3
      S3_ENDPOINT: ${S3_ENDPOINT:?S3_ENDPOINT requerido}
      S3_BUCKET: ${S3_BUCKET:?S3_BUCKET requerido}
      S3_REGION: ${S3_REGION:-auto}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?S3_ACCESS_KEY_ID requerido}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?S3_SECRET_ACCESS_KEY requerido}
      S3_SESSION_TOKEN: ${S3_SESSION_TOKEN:-}
      ALLOW_LOCAL_PRIVATE_STORAGE: "false"
      ALLOW_PUBLIC_LOCAL_UPLOADS: "false"
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      BUZZBEE_AI_MODEL: ${BUZZBEE_AI_MODEL:-gpt-5-mini}
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "4000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    networks:
      - app
      - db
    security_opt:
      - no-new-privileges:true

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile.production
      args:
        VITE_API_URL: /api
    restart: always
    expose:
      - "80"
    networks:
      - app
    security_opt:
      - no-new-privileges:true

  caddy:
    image: caddy:2-alpine
    restart: always
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?APP_DOMAIN requerido}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./infra/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_started
    networks:
      - app
    security_opt:
      - no-new-privileges:true

volumes:
  buzzbee_postgres_data:
  caddy_data:
  caddy_config:

networks:
  app:
  db:
    internal: true
