name: Cloudflare Pages · business-os (manual release)
on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: 'Full 40-character SHA from main to publish'
        required: true
        type: string
      confirm_publish:
        description: 'Authorize publishing this SHA to Cloudflare Pages (not DNS)'
        required: true
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: cloudflare-pages-business-os-production
  cancel-in-progress: false
jobs:
  publish:
    if: ${{ github.ref == 'refs/heads/main' && inputs.confirm_publish == true }}
    name: QA and publish verified frontend
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: cloudflare-pages
    steps:
      - name: Checkout exact main SHA
        uses: actions/checkout@v7
      - name: Verify requested SHA
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        shell: bash
        run: |
          if [[ ! "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ || "$EXPECTED_SHA" != "$GITHUB_SHA" ]]; then
            echo "::error::Release SHA must match the exact 40-character main SHA"
            exit 1
          fi
          git diff --exit-code
      - name: Check credentials and public API origin without exposing values
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          VITE_API_URL: ${{ vars.BUSINESS_OS_API_URL }}
        shell: bash
        run: |
          if [[ -z "$CLOUDFLARE_API_TOKEN" || -z "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "::error::Cloudflare Pages secrets are not configured"
            exit 1
          fi
          node --input-type=module <<'NODE'
          let url;
          try { url = new URL(process.env.VITE_API_URL); } catch { /* invalid or missing */ }
          const invalid = !url || url.protocol !== 'https:' || url.pathname.replace(/\/$/, '') !== '/api'
            || url.username || url.password || url.search || url.hash
            || ['localhost', '127.0.0.1', '0.0.0.0', '::1'].includes(url.hostname);
          if (invalid) {
            console.error('::error::BUSINESS_OS_API_URL must be a real HTTPS backend URL ending in /api');
            process.exit(1);
          }
          NODE
      - name: Set up Node 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Install locked monorepo dependencies
        run: npm ci --include=dev
      - name: Lint web
        run: npm run lint --workspace apps/web
      - name: Build web with verified public API origin
        env:
          VITE_API_URL: ${{ vars.BUSINESS_OS_API_URL }}
        run: npm run build --workspace apps/web
      - name: Offline, multiempresa, visual and release gates
        run: |
          npm run release:final
          npm run ui:light-navigation:audit
          npm run mobile:verify
          npm run security:regressions
          node --test scripts/validate-cloudflare-pages-policy.test.mjs
          test -s apps/web/dist/index.html
          test -s apps/web/dist/manifest.webmanifest
          test -s apps/web/dist/sw.js
          test -s apps/web/dist/_headers
      - name: Publish static frontend to existing business-os Pages project
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.45.0'
          command: pages deploy apps/web/dist --project-name=business-os --branch=main --commit-hash=${{ github.sha }}
