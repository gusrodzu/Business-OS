name: Agent Office Independent QA
on:
  pull_request:
    paths:
      - 'sites/agent-office/**'
      - 'scripts/validate-agent-office-independent.test.mjs'
      - 'scripts/validate-agent-office-mobile-app.test.mjs'
      - 'scripts/validate-agent-office-character-art.test.mjs'
      - '.github/workflows/agent-office-independent-qa.yml'
  push:
    branches: [main]
    paths:
      - 'sites/agent-office/**'
      - 'scripts/validate-agent-office-independent.test.mjs'
      - '.github/workflows/agent-office-independent-qa.yml'
permissions:
  contents: read
concurrency:
  group: agent-office-qa-${{ github.ref }}
  cancel-in-progress: true
jobs:
  static-site:
    name: Independent site syntax and security contracts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: JavaScript syntax
        run: |
          node --check sites/agent-office/public/app.js
          node --check sites/agent-office/public/officeMotion.js
          node --check sites/agent-office/public/agentArtwork.js
      - name: Independent deployment and safety tests
        run: node --test scripts/validate-agent-office-independent.test.mjs scripts/validate-agent-office-motion.test.mjs scripts/validate-agent-office-mobile-app.test.mjs scripts/validate-agent-office-character-art.test.mjs
      - name: Verify required static site files
        run: |
          test -s sites/agent-office/public/index.html
          test -s sites/agent-office/public/app.js
          test -s sites/agent-office/public/officeMotion.js
          test -s sites/agent-office/public/agentArtwork.js
          test -s sites/agent-office/public/styles.css
          test -s sites/agent-office/public/_headers
          test -s sites/agent-office/wrangler.toml
