name: Dependency Security Triage
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: dependency-security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  dependency-triage:
    name: npm audit (all and production)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-fund
      - name: Authentication and CSRF security regression suite
        run: npm run security:regressions
      - name: Report npm advisories
        if: success() || failure()
        run: node scripts/report-npm-security.mjs
      - name: Attach vulnerability report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-security-report
          path: .qa-reports/dependencies-security.json
          if-no-files-found: warn
          retention-days: 14
