name: Deploy Business OS to Cloudflare Pages

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-pages-business-os
  cancel-in-progress: false

jobs:
  deploy:
    name: QA and deploy selected commit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: cloudflare-pages
    steps:
      - name: Checkout selected ref
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Require Cloudflare credentials
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CF_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CF_ACCOUNT" || { echo "Missing CLOUDFLARE_ACCOUNT_ID"; exit 1; }
      - name: Install locked dependencies
        run: npm ci --include=dev
      - name: Lint
        run: npm run lint --workspace apps/web
      - name: Build
        run: npm run build
      - name: Offline UAT
        run: npm run uat:offline
      - name: Tenant isolation
        run: npm run uat:tenant
      - name: Verify output
        run: |
          test -s apps/web/dist/index.html
          test -s apps/web/dist/manifest.webmanifest
      - name: Publish to Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 pages deploy apps/web/dist --project-name=business-os --branch=main --commit-hash="$GITHUB_SHA"
