name: Safe PR Eligibility Audit
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: read
  actions: read
concurrency:
  group: safe-pr-auto-merge
  cancel-in-progress: false
jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      DRY_RUN: 'true'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Report eligible PRs without auto-merging
        run: node scripts/ci/safe-auto-merge.mjs
