name: Prisma 7 Isolated Migration Candidate
on:
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  prisma7:
    if: github.repository == 'gusrodzu/Business-OS' && github.head_ref == 'security/prisma7-postgres-candidate'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: erpqa
          POSTGRES_PASSWORD: erpqa
          POSTGRES_DB: erpqa
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U erpqa -d erpqa"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      DATABASE_URL: postgresql://erpqa:erpqa@127.0.0.1:5432/erpqa?schema=public
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security/prisma7-postgres-candidate
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Resolve Prisma 7 lockfile without scripts or major forcing
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          git diff --stat -- package-lock.json
          node -e "const p=require('./package-lock.json'); for(const n of ['prisma','@prisma/client','@prisma/adapter-pg']) {const k='node_modules/'+n; if(p.packages[k]?.version!=='7.10.1')throw Error(k+' is not pinned at 7.10.1')}"
      - name: Clean install
        run: npm ci
      - name: Validate Prisma schema
        working-directory: apps/api
        run: npx prisma validate
      - name: Generate Prisma 7 client
        working-directory: apps/api
        run: npx prisma generate
      - name: Apply schema to disposable PostgreSQL only
        working-directory: apps/api
        run: npx prisma db push --accept-data-loss
      - name: Runtime PostgreSQL smoke test
        working-directory: apps/api
        run: |
          node --input-type=module -e "import {prisma} from './src/lib/prisma.js'; await prisma.\$connect(); const n=await prisma.company.count(); if(n!==0)throw Error('expected blank temporary database'); console.log('Prisma 7 + PG17 PASS'); await prisma.\$disconnect();"
      - name: Existing frontend and offline tests
        run: |
          npm run lint --workspace apps/web
          npm run build --workspace apps/web
          npm run visual:audit
          npm run uat:offline
          npm run uat:offline:persistence
      - name: List remaining production advisories
        run: npm audit --omit=dev || test "$?" -eq 1
      - name: Commit tested dependency lockfile and remove bootstrap workflow
        run: |
          rm .github/workflows/prisma7-migration-candidate.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git add -u .github/workflows/prisma7-migration-candidate.yml
          git commit -m "security(prisma): pin verified Prisma 7 PG adapter dependency tree"
          git push origin HEAD:security/prisma7-postgres-candidate
