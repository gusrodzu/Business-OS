# One-time branch-only lockfile regeneration. Removed after the resolved lockfile is committed.
name: Temporary ESLint 10 lockfile migration
on:
  pull_request:
    branches: [main]
    paths:
      - apps/web/package.json
      - .github/workflows/eslint10-lockfile-migrate.yml
permissions:
  contents: write
jobs:
  resolve-lockfile:
    if: github.repository == 'gusrodzu/Business-OS' && github.head_ref == 'chore/eslint10-react-hooks7-20261024' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: chore/eslint10-react-hooks7-20261024
          persist-credentials: true
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Regenerate only lockfile for compatible ESLint toolchain
        run: |
          test "$(npm config get allow-remote)" = "root"
          npm install --package-lock-only --ignore-scripts --no-fund
          git diff --exit-code -- package.json apps/api/package.json apps/web/package.json
      - name: Validate resulting dependency tree and install
        run: npm ci --include=dev
      - name: Commit lockfile to isolated review branch
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "No lockfile update required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- package-lock.json
          git commit -m "chore(lockfile): resolve ESLint 10 and React Hooks lint dependencies"
          git push origin HEAD:chore/eslint10-react-hooks7-20261024
