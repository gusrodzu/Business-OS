name: Frontend QA
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: frontend-qa-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  frontend:
    name: Build, lint, visual and offline
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Source baseline for ESLint diagnosis
        run: |
          git rev-parse HEAD
          wc -l apps/web/src/modules/settings/ui/pages/Preferences.jsx
          sha256sum apps/web/src/modules/settings/ui/pages/Preferences.jsx
      - name: Install locked dependencies
        run: npm ci
      - name: Lint frontend
        run: npm run lint --workspace apps/web
      - name: Build frontend
        if: success() || failure()
        run: npm run build --workspace apps/web
      - name: Verify source unchanged by install and build
        if: success() || failure()
        run: |
          wc -l apps/web/src/modules/settings/ui/pages/Preferences.jsx
          sha256sum apps/web/src/modules/settings/ui/pages/Preferences.jsx
          git diff --exit-code -- apps/web/src/modules/settings/ui/pages/Preferences.jsx
      - name: Data Hub supported format regression
        if: success() || failure()
        run: node apps/api/scripts/validate-datahub-formats.mjs
      - name: Visual audit
        if: success() || failure()
        run: npm run visual:audit
      - name: Offline UAT
        if: success() || failure()
        run: npm run uat:offline

      - name: Offline POS and collections persistence
        if: success() || failure()
        run: npm run uat:offline:persistence
