name: Frontend QA
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: frontend-qa-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  frontend:
    name: Build, lint, visual and offline
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Node 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Source baseline for ESLint diagnosis
        run: |
          git rev-parse HEAD
          wc -l apps/web/src/modules/settings/ui/pages/Preferences.jsx
          sha256sum apps/web/src/modules/settings/ui/pages/Preferences.jsx
      - name: Verify restricted remote tarball policy
        run: |
          npm --version
          npm config get allow-remote
          test "$(npm config get allow-remote)" = "root"
      - name: Install locked dependencies
        run: npm ci --include=dev
      - name: Lint frontend
        run: npm run lint --workspace apps/web
      - name: Build frontend
        if: success() || failure()
        run: npm run build --workspace apps/web
      - name: Smartphone layout regression audit
        if: success() || failure()
        run: npm run mobile:responsive:audit
      - name: Mobile / PWA foundation smoke
        if: success() || failure()
        run: |
          npm run mobile:verify
          test -s apps/web/dist/manifest.webmanifest
          test -s apps/web/dist/sw.js
          test -s apps/web/dist/icons/icon-192.png
          test -s apps/web/dist/icons/icon-512.png
      - name: Final release and multi-company static gates
        if: success() || failure()
        run: npm run release:final
      - name: Verify source unchanged by install and build
        if: success() || failure()
        run: |
          wc -l apps/web/src/modules/settings/ui/pages/Preferences.jsx
          sha256sum apps/web/src/modules/settings/ui/pages/Preferences.jsx
          git diff --exit-code -- apps/web/src/modules/settings/ui/pages/Preferences.jsx
      - name: Data Hub supported format regression
        if: success() || failure()
        run: node apps/api/scripts/validate-datahub-formats.mjs
      - name: Visual audit
        if: success() || failure()
        run: npm run visual:audit
      - name: Offline UAT
        if: success() || failure()
        run: npm run uat:offline

      - name: Offline POS and collections persistence
        if: success() || failure()
        run: npm run uat:offline:persistence
