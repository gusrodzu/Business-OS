name: Frontend QA
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: frontend-qa-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  frontend:
    name: Build, lint, visual and offline
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Build frontend
        run: npm run build --workspace apps/web
      - name: Lint frontend
        run: npm run lint --workspace apps/web
      - name: Visual audit
        run: npm run visual:audit
      - name: Offline UAT
        run: npm run uat:offline
