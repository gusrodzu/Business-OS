name: ERP Route Render Sweep
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'apps/web/src/**'
      - 'apps/web/package.json'
      - 'package-lock.json'
      - 'scripts/audit-all-routes-browser.mjs'
      - '.github/workflows/erp-route-render-sweep.yml'
permissions:
  contents: read
concurrency:
  group: erp-route-render-${{ github.ref }}
  cancel-in-progress: true
jobs:
  route-sweep:
    name: Browser every ERP route (Demo Local)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --include=dev
      - name: Validate React runtime pairing
        run: npm run react:versions:audit
      - name: Build Vite app
        run: npm run build -w apps/web
      - name: Start local preview
        run: |
          nohup npm run preview -w apps/web -- --host 127.0.0.1 --port 4173 > /tmp/business-os-route-preview.log 2>&1 &
          echo $! > /tmp/business-os-route-preview.pid
      - name: Sweep all registered ERP routes in Chrome
        run: node scripts/audit-all-routes-browser.mjs
      - name: Upload URL-by-URL results and crash screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: business-os-erp-route-render-audit
          path: artifacts/route-audit/
          retention-days: 14
          if-no-files-found: warn
